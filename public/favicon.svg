<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="warm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDC830" />
      <stop offset="100%" stop-color="#F37335" />
    </linearGradient>
  </defs>

  <!-- White Card with distinct Yellow-to-Orange Gradient Border (prominent for 16px/32px visibility) -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="#FFFFFF" stroke="url(#warm-grad)" stroke-width="36" />

  <!-- SF Initials in signature Warm Gradient -->
  <text x="256" y="338"
        text-anchor="middle"
        fill="url(#warm-grad)"
        font-family="'Source Sans Pro', -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="250"
        font-weight="700"
        letter-spacing="4">SF</text>
</svg>

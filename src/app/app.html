<section class="home" id="home">
  <div class="container rounded-3">
    <div class="row gx-md-5">
      <div class="col-12 col-md-5 content-media">
        <img src="assets/images/self_large.jpg" alt="Sebastian Fuss" class="img-fluid rounded-3" />
      </div>
      <div class="col-12 col-md-7 content">
        <h1 class="display-4 fw-lighter mt-2 mt-md-0">Sebastian Fuss</h1>
        <p class="lead">
          Frankfurt-based developer, project manager,<br class="d-none d-lg-inline">
          basketball coach and referee, aviation enthusiast.
        </p>
        <p class="social">
          <a *ngFor="let _social of social;  let first = first; let last = last" [href]="_social.link"
            [title]="_social.title" class="btn btn-outline-primary" [class.me-1]="first" [class.ms-1]="last"
            [class.mx-1]="!first && !last"><i class="fa-fw" [class]="_social.iconClasses"></i></a>
        </p>
      </div>
    </div>
  </div>
</section>
<router-outlet id="content"></router-outlet>
<footer class="bg-dark text-white mt-5">
  <div class="container py-5">
    <div class="row">
      <div class="col-6 col-lg-3">
        <ul class="list-unstyled">
          <li class="py-2"><a [routerLink]="['']" title="Home" pageScroll href="#home">Home</a></li>
          <li class="py-2"><a [routerLink]="['contact']" title="Contact" pageScroll href="#content">Contact</a></li>
        </ul>
      </div>
      <div class="col-6 col-lg-3">
        <ul class="list-unstyled">
          <li class="py-2"><a title="Cookie Settings" (click)="showCookieBanner($event)" href="">Cookie Settings</a>
          </li>
          <li class="py-2"><a [routerLink]="['privacy']" title="Privacy Policy" pageScroll href="#content">Privacy
              Policy</a></li>
          <li class="py-2"><a [routerLink]="['imprint']" title="Imprint" pageScroll href="#content">Imprint</a></li>
        </ul>
      </div>
      <div class="col-12 col-sm-6 col-lg-3 order-lg-2">
        <h5>Get in touch</h5>
        <p><a href="mailto:hi@sebastian-fuss.de">hi@sebastian-fuss.de</a></p>
      </div>
      <div class="col-12 col-sm-6 col-lg-3 pt-4 pt-sm-0 order-last order-lg-first text-center text-sm-start">
        <h4>Sebastian Fuss</h4>
        <p class="text-muted">&copy; 2026</p>
      </div>
    </div>
  </div>
</footer>

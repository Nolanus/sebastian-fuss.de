<section>
  <div class="container">
    <div class="row">
      <div class="col-12 col-md-8 offset-md-2">
        <h2>Contact</h2>
        <p>Send me a message in case of questions, suggestions or you just want to say hello.</p>
        <form (ngSubmit)="sendMessage()" #form="ngForm">
          <label for="gotcha"></label>
          <input type="text" id="gotcha" name="_gotcha" class="d-none"/>

          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="name-input" name="name" [(ngModel)]="input.name"
                   placeholder="Your name" #name="ngModel" required [class.is-invalid]="!name.valid && name.touched">
            <label for="name-input">Name</label>
            <div class="invalid-feedback" *ngIf="!name.valid && name.touched">Name cannot be empty.</div>
          </div>

          <div class="form-floating mb-3">
            <input type="email" class="form-control" id="mail-input" name="email" [(ngModel)]="input.email"
                   placeholder="Your E-mail" #email="ngModel" required pattern="[a-zA-Z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,12}$"
                   [class.is-invalid]="!email.valid && email.touched">
            <label for="mail-input">E-mail</label>
            <div class="invalid-feedback" *ngIf="!email.valid && email.touched">
              Valid E-mail required.
            </div>
          </div>

          <div class="form-floating mb-3">
            <textarea class="form-control" id="message-input" placeholder="Your message" name="message"
                      [(ngModel)]="input.text"
                      #text="ngModel" required [class.is-invalid]="!text.valid && text.touched"></textarea>
            <label for="message-input">Message</label>
            <div class="invalid-feedback" *ngIf="!text.valid && text.touched">
              Message cannot be empty.
            </div>
          </div>

          <div class="form-group mb-3">
              <input type="submit" class="form-control btn-primary" id="send-button" name="send" value="Send"
                     [disabled]="sending">
          </div>
        </form>
        <div class="valid-feedback" [class.d-block]="status === ''">
          Thank you for your message, it has been sent successfully. I'll get back to you as soon as possible.
        </div>
        <div class="alert alert-primary" role="alert" *ngIf="status">
          <strong>{{ status }}</strong>
        </div>
      </div>
    </div>
  </div>
</section>
